site_name: Yudetter API
site_description: Yudetter API 非公式ドキュメント
site_url: https://v0lkey.github.io/yudetter-api-docs/
repo_url: https://github.com/v0lkey/yudetter-api-docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: pink
  features:
    - navigation.instant
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - toc:
      permalink: true

nav:
  - 概要: index.md
  - 共通仕様: overview.md
  - データモデル: models.md
  - ユーザー系 (users):
